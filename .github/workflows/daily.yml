name: Publish feed

# Runs the pipeline against the live APIs and publishes out/ to the gh-pages branch, which
# GitHub Pages serves at https://<owner>.github.io/<repo>/feed/{signals,results,meta,health}.json.
# The gh-pages branch is the pipeline's state: feed/ (latest), archive/ (every signals version,
# never rewritten) and odds/ (snapshots for closing odds). Nothing is pushed unless the run and
# the validation of every feed file succeeded (FR-D11).

on:
  schedule:
    - cron: "0 6 * * *"    # signals for the next 48 h (4 odds credits)
    - cron: "0 17 * * *"   # pre-kickoff odds snapshot for closing odds (4 odds credits)
    - cron: "20 */3 * * *" # results of the last 14 days (no odds credits)
  workflow_dispatch:
    inputs:
      job:
        description: Pipeline job to run
        type: choice
        options: [daily, closing, results]
        default: daily
      simulate_failure:
        description: Run with invalid API keys; the run must fail and publish nothing
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_DIR: ${{ github.workspace }}/site
    steps:
      - name: Pick the job
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ inputs.job }}
        run: |
          case "$SCHEDULE" in
            "0 6 * * *")    job=daily ;;
            "0 17 * * *")   job=closing ;;
            "20 */3 * * *") job=results ;;
            "")             job="$INPUT_JOB" ;;
            *) echo "::error::unknown schedule '$SCHEDULE'"; exit 1 ;;
          esac
          case "$job" in daily|closing|results) ;; *) echo "::error::bad job '$job'"; exit 1 ;; esac
          echo "job=$job" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "Running job: $job"

      - name: Check out the code
        uses: actions/checkout@v5

      - name: Check out the published feed (gh-pages)
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: site

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      - name: Install the pipeline
        run: python -m pip install -e ./pipeline

      - name: Restore the history cache
        if: steps.pick.outputs.job == 'daily'
        uses: actions/cache@v4
        with:
          path: pipeline/.cache/history
          key: history-${{ steps.pick.outputs.day }}
          restore-keys: history-

      - name: Run the pipeline
        env:
          JOB: ${{ steps.pick.outputs.job }}
          SIMULATE_FAILURE: ${{ inputs.simulate_failure && 'true' || 'false' }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          if [ "$SIMULATE_FAILURE" = "true" ]; then
            echo "::warning::simulate_failure: running with invalid API keys"
            export ODDS_API_KEY=invalid-key FOOTBALL_DATA_ORG_TOKEN=invalid-token API_FOOTBALL_KEY=
            if betadvisor "run-$JOB" --out "$SITE_DIR"; then
              echo "::error::the run succeeded although the keys were invalid"
            fi
            exit 1
          fi
          betadvisor "run-$JOB" --out "$SITE_DIR"

      - name: Validate the feed and record the heartbeat
        env:
          JOB: ${{ steps.pick.outputs.job }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          betadvisor validate --out "$SITE_DIR"
          betadvisor heartbeat "$JOB" --out "$SITE_DIR" --run-url "$RUN_URL"
          betadvisor validate --out "$SITE_DIR"

      - name: Publish to gh-pages
        working-directory: site
        env:
          JOB: ${{ steps.pick.outputs.job }}
        run: |
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -q -m "feed: $JOB $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q origin HEAD:gh-pages
          git log -1 --format='published %h %s'

      - name: Report the failure in an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: ${{ steps.pick.outputs.job }}
          EVENT: ${{ github.event_name }}
          SIMULATED: ${{ inputs.simulate_failure && ' (simulated)' || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create pipeline-failure --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "Scheduled feed run failed" --force
          body="The \`${JOB:-unknown}\` job failed${SIMULATED} ($EVENT): $RUN_URL
          The published feed was left unchanged."
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label pipeline-failure \
            --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label pipeline-failure \
              --title "Feed pipeline failing" --body "$body"
          fi
