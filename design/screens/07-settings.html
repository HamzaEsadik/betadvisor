<!DOCTYPE html>
<!-- Screen: Settings. Extracted from "BetAdvisor app UI.html" (390x844 board).
     Shared: ../shared/tokens.css (colors/spacing/type, dark+light), ../shared/components.css,
             ../shared/components.js (BetAdvisor.* React components used via <x-import>).
     Template syntax: {{expr}} binds to values returned by renderVals() in the script at the bottom. -->
<html lang="en"><head><meta charset="utf-8"><title>Settings</title>
<link rel="stylesheet" href="../shared/tokens.css"><link rel="stylesheet" href="../shared/components.css">
<style>body{margin:0}h1,p{margin:0}
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);overflow:hidden}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;padding:6px 16px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);font-family:inherit;text-align:left;cursor:pointer}
.srow:last-child{border-bottom:0}
.srow:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.val{display:inline-flex;align-items:center;gap:4px;color:var(--ink-muted)}
.switch{position:relative;flex:none;width:52px;height:32px;border-radius:999px;background:var(--brand);border:0;padding:0;cursor:pointer}
.switch:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.knob{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:999px;background:var(--on-brand)}</style>
</head><body>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
  <div style="height: 28px; flex: none"></div>
  <x-import component-from-global-scope="BetAdvisor.AppBar" title="Settings" on-back="{{noop}}"></x-import>
  <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 8px 16px 12px">
    <span class="overline" style="color: var(--ink-subtle)">Staking</span>
    <div class="group">
      <button type="button" class="srow"><span class="body-strong">Per-bet cap</span><span class="val body">5% of bankroll<x-import component-from-global-scope="BetAdvisor.Icon" name="chevron-right" size="{{icon}}"></x-import></span></button>
      <button type="button" class="srow"><span class="body-strong">Daily exposure cap</span><span class="val body">15% of bankroll<x-import component-from-global-scope="BetAdvisor.Icon" name="chevron-right" size="{{icon}}"></x-import></span></button>
      <button type="button" class="srow"><span class="body-strong">Minimum stake</span><span class="val body" style="font-variant-numeric: tabular-nums">$1.00<x-import component-from-global-scope="BetAdvisor.Icon" name="chevron-right" size="{{icon}}"></x-import></span></button>
    </div>
    <p class="caption" style="color: var(--ink-subtle); padding: 0 4px 8px">Caps apply to advice from the next day. Frozen bets never change.</p>
    <span class="overline" style="color: var(--ink-subtle)">Reminders</span>
    <div class="group">
      <div class="srow" style="cursor: default">
        <span class="body-strong">Daily notification</span>
        <button type="button" class="switch" role="switch" aria-checked="true" aria-label="Daily notification"><span class="knob"></span></button>
      </div>
      <button type="button" class="srow"><span class="body-strong">Notification time</span><span class="val body" style="font-variant-numeric: tabular-nums">07:30<x-import component-from-global-scope="BetAdvisor.Icon" name="chevron-right" size="{{icon}}"></x-import></span></button>
    </div>
    <span class="overline" style="color: var(--ink-subtle); margin-top: 8px">Display</span>
    <div class="group">
      <button type="button" class="srow"><span class="body-strong">Currency symbol</span><span class="val body">$ (display only)<x-import component-from-global-scope="BetAdvisor.Icon" name="chevron-right" size="{{icon}}"></x-import></span></button>
      <button type="button" class="srow"><span class="body-strong">Theme</span><span class="val body">Match system<x-import component-from-global-scope="BetAdvisor.Icon" name="chevron-right" size="{{icon}}"></x-import></span></button>
    </div>
    <span class="overline" style="color: var(--ink-subtle); margin-top: 8px">Data</span>
    <div class="group">
      <button type="button" class="srow">
        <span style="display: flex; flex-direction: column"><span class="body-strong">Refresh data</span><span class="caption" style="color: var(--ink-muted)">Last updated today 07:00</span></span>
        <span class="val"><x-import component-from-global-scope="BetAdvisor.Icon" name="rotate-ccw" size="{{icon}}"></x-import></span>
      </button>
    </div>
  </div>
  <x-import component-from-global-scope="BetAdvisor.TabBar" items="{{tabs}}" active="more"></x-import>
  <div style="height: 12px; flex: none; background: var(--surface)"></div>
</div>
<script type="text/dc-logic">
class Component extends DCLogic {
  renderVals() {
    return {
      theme: this.props.theme ?? 'dark',
      icon: 20,
      noop: () => {},
      tabs: [
        { key: 'today', label: 'Today', icon: 'calendar-days' },
        { key: 'ledger', label: 'Ledger', icon: 'list-ordered' },
        { key: 'perf', label: 'Performance', icon: 'chart-line' },
        { key: 'sessions', label: 'Sessions', icon: 'layers' },
        { key: 'more', label: 'More', icon: 'settings' }
      ]
    };
  }
}
</script>
</body></html>
