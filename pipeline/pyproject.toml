[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "betadvisor"
version = "0.1.0"
description = "BetAdvisor data pipeline: fixtures, odds, model, decision engine, feed publishing"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "requests>=2.32",
    "jsonschema>=4.23",
    "pydantic>=2.8",
    "typer>=0.12",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "types-requests",
    "types-jsonschema",
]

[project.scripts]
betadvisor = "betadvisor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
betadvisor = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["betadvisor"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true
