<!DOCTYPE html>
<!-- Screen: Reset budget sheet. Extracted from "BetAdvisor app UI.html" (390x844 board).
     Shared: ../shared/tokens.css (colors/spacing/type, dark+light), ../shared/components.css,
             ../shared/components.js (BetAdvisor.* React components used via <x-import>).
     Template syntax: {{expr}} binds to values returned by renderVals() in the script at the bottom. -->
<html lang="en"><head><meta charset="utf-8"><title>Reset budget sheet</title>
<link rel="stylesheet" href="../shared/tokens.css"><link rel="stylesheet" href="../shared/components.css">
<style>body{margin:0}h1,h2,p{margin:0}</style>
</head><body>
<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
  <div style="height: 28px; flex: none"></div>
  <x-import component-from-global-scope="BetAdvisor.AppBar" title="Sessions" large="{{yes}}"></x-import>
  <div style="display: flex; flex-direction: column; gap: 12px; padding: 4px 16px">
    <span class="overline" style="color: var(--ink-subtle)">Active</span>
    <x-import component-from-global-scope="BetAdvisor.SessionCard" title="Session 2" dates="12 Oct 2026 – today" status="active" start-budget="{{active.start}}" final-bankroll="{{active.bankroll}}" roi="{{active.roi}}" bets="{{active.bets}}" currency="$"></x-import>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--scrim)"></div>
  <section aria-label="Reset budget" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 12px 16px 28px; background: var(--surface-raised); border-radius: var(--radius-xl) var(--radius-xl) 0 0; box-shadow: var(--shadow-sheet)">
    <div aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: var(--line-strong)"></div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h2 class="title-md">Reset budget</h2>
      <p class="body" style="color: var(--ink-muted)">This closes Session 2 and starts a new session. Nothing is deleted.</p>
    </div>
    <div style="display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md)">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line)">
        <span class="body">Current bankroll</span>
        <span class="odds" style="font-variant-numeric: tabular-nums">$102.17</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px">
        <div style="display: flex; flex-direction: column">
          <span class="body">Open bets</span>
          <span class="caption" style="color: var(--ink-muted)">Archived with Session 2 and still settled for the record</span>
        </div>
        <span class="odds" style="font-variant-numeric: tabular-nums">3</span>
      </div>
    </div>
    <x-import component-from-global-scope="BetAdvisor.BudgetInput" label="New starting budget" value="300.00" currency="$" presets="{{presets}}"></x-import>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <x-import component-from-global-scope="BetAdvisor.Button" variant="primary" full="{{yes}}">Archive and start new</x-import>
      <x-import component-from-global-scope="BetAdvisor.Button" variant="secondary" full="{{yes}}">Cancel</x-import>
    </div>
  </section>
</div>
<script type="text/dc-logic">
class Component extends DCLogic {
  renderVals() {
    return {
      theme: this.props.theme ?? 'dark',
      yes: true,
      presets: [100, 300, 500, 1000],
      active: { start: 100, bankroll: 102.17, roi: 0.097, bets: 34 }
    };
  }
}
</script>
</body></html>
